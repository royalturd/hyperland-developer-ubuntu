# hyprlang noerror false
# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`

# --- Carried over from previous config ---
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# --- Fluid animations override ---
# Smooth ease-out curves (no hard snap / long stall), slightly longer durations.
animations {
    bezier = fluid, 0.22, 1, 0.36, 1          # easeOutQuint
    bezier = fluidIn, 0.64, 0, 0.78, 0        # easeInQuint (for exits)
    bezier = fluidSoft, 0.25, 0.1, 0.25, 1    # gentle ease
    bezier = linear, 0, 0, 1, 1

    animation = windowsIn, 1, 4, fluid, popin 85%
    animation = windowsOut, 1, 3, fluidIn, popin 90%
    animation = windowsMove, 1, 4, fluid, slide
    animation = fadeIn, 1, 3, fluidSoft
    animation = fadeOut, 1, 2.5, fluidSoft
    animation = fadeSwitch, 1, 4, fluidSoft
    animation = fadeDim, 1, 4, fluidSoft
    animation = border, 1, 8, fluidSoft
    animation = layersIn, 1, 3.5, fluid, popin 93%
    animation = layersOut, 1, 2.5, fluidIn, popin 94%
    animation = fadeLayersIn, 1, 2.5, fluidSoft
    animation = fadeLayersOut, 1, 2, fluidSoft
    animation = workspaces, 1, 5, fluid, slidefade 15%
    animation = specialWorkspaceIn, 1, 4, fluid, slidevert
    animation = specialWorkspaceOut, 1, 3, fluidIn, slidevert
    animation = zoomFactor, 1, 4, fluid
}

# Lighter blur: less GPU work per frame on the Vega iGPU = fewer dropped frames
decoration {
    blur {
        size = 6
        passes = 2
    }
}

misc {
    vfr = true
}

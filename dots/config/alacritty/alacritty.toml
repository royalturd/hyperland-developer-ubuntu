
[window]
opacity = 0.9
blur = true
padding = { x = 12, y = 12 }
dynamic_title = true

[cursor]
style = { shape = "Beam", blinking = "Always" }
blink_interval = 500

[selection]
save_to_clipboard = true

[general]
import = [
  "~/.config/alacritty/end4.toml"
]

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 11
